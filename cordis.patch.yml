- insert:
    - id: mimo-voice-report
      name: 'mimo-voice-report'
      config:
        # MiMo is OpenAI-compatible. Token-plan keys live on token-plan-cn;
        # pay-as-you-go keys use https://api.xiaomimimo.com/v1
        baseUrl: 'https://token-plan-cn.xiaomimimo.com/v1'

        # Ships with two bundled reference clips, selectable in
        # Settings → Plugins → MiMo Voice Report:
        #   voice-sample.mp3         原版    — neutral demo take
        #   voice-sample-playful.mp3 俏皮版  — playful take
        # Both are synthetic (MiMo voice-clone of a test line); no original
        # recording is bundled. Drop your own 5–15s dry speech next to index.js
        # to add another option, or switch to a preset voice:
        #   model: 'mimo-v2.5-tts'
        #   voice: '冰糖'
        model: 'mimo-v2.5-tts-voiceclone'
        voice: '冰糖'
        voiceSample: 'voice-sample.mp3'

        # Optional portrait for the popup (png/webp/jpeg/gif, relative to this package).
        # Leave empty to show the speech bubble only.
        avatar: 'avatar.webp'

        # Delivery instruction (role: user, never spoken). Empty = faithful to the sample.
        style: ''
        # Audio style tag prepended to the text: playful + girlish-cute. Empty disables it.
        tags: '(俏皮 稚嫩)'

        # How the whale girl addresses you in the spoken notice, appended to
        # the opening line (e.g. 任务完成啦，主人。). Empty = no address;
        # editable in Settings → Plugins → MiMo Voice Report.
        callMe: ''

        # Your own closing lines, one per entry, shuffled into the matching
        # built-in pool per bucket: completed / error / aborted (the
        # "interrupted" reason shares the aborted bucket). customOnly: true
        # makes a bucket with custom lines use only yours. Example:
        #   customAnnounces:
        #     completed: ['鱼干已备好，请查收。']
        #     error:     ['呜，翻车了，我再看一眼。']
        #     aborted:   ['先搁这儿，想继续喊我。']
        customAnnounces: {}
        customOnly: false

        # When MiMo is unavailable: errors are classified (auth / quota /
        # timeout / network / 5xx), transient ones retry once, and 3
        # consecutive failures open a cooldown (cooldownMs, default 5 min)
        # that skips the API entirely; reports fall back to the bundled
        # chime (fallbackDing, '' disables). See the mimo section of /state.
        fallbackDing: 'fallback-ding.wav'
        cooldownMs: 300000

        maxChars: 90
        staleMs: 25000

        # MiMo API key. Empty falls back to MIMO_API_KEY, then ~/.dsh/.credentials.yaml refs.
        # You can also paste it in Settings → Plugins → MiMo Voice Report, which writes back here.
        apiKey: ''
