- insert:
    - id: mimo-voice-report
      name: 'mimo-voice-report'
      config:
        baseUrl: 'https://token-plan-cn.xiaomimimo.com/v1'
        # 复刻采样：随插件发布的自生成测试台词（7.7 秒），本地与仓库同一条
        model: 'mimo-v2.5-tts-voiceclone'
        voiceSample: 'voice-sample.mp3'
        # 播报时弹出的立绘（相对插件目录）
        avatar: 'avatar.webp'
        # 语气指令留空（不改音高）；俏皮 + 少女感交给标签
        style: ''
        tags: '(俏皮 稚嫩)'
        # 播报里对你的称呼（如「主人」「老板」），缀在结束提示后："任务完成啦，主人。"
        # 留空则不称呼；也可在「设置 → 插件」的卡片里改，写回这一行。
        callMe: ''
        # 自定义结束语库：按 完成/出错/中止 三类分别配（一行一句，随机并入对应内置池；
        # 中止桶也用于「被打断」）。customOnly: true 时配了自定义的桶只用你写的。
        # 想带称呼就直接写进句子里，写了就不再自动缀 callMe。例：
        #   customAnnounces:
        #     completed: ['鱼干已备好，请查收。']
        #     error:     ['呜，翻车了，我再看一眼。']
        #     aborted:   ['先搁这儿，想继续喊我。']
        customAnnounces: {}
        customOnly: false
        # MiMo 不可用时的应对：鉴权/额度/超时/网络错误会分类提示；
        # 瞬态错误自动重试一次，连续 3 次失败进入冷却期（cooldownMs，默认 5 分钟）跳过直连，
        # 播报改用内置"叮"声兜底（留空 fallbackDing 禁用），/state 的 mimo 段可看熔断状态。
        fallbackDing: 'fallback-ding.wav'
        cooldownMs: 300000
        maxChars: 90
        staleMs: 25000
        # 播放音量 0–1（默认 1 = 全音量）；设置卡里的滑杆写回这一行，浏览器半乘在 audio.volume 上。
        volume: 1
        # 每音色的人设提示词（音色id → 人设句）：驱动摘要模型按该角色的口吻生成汇报口播稿。
        # 留空用内置默认（PERSONA_PROMPTS）；设置卡的「人设提示词」编辑框写回这里。
        personaPrompts: {}
        # 汇报语种（zh/en/ja/ko）：非中文时语音说该语种（中文稿整段翻译、保留人设口吻），
        # 字幕原文后附中文译文；翻译失败回落中文播报。
        language: 'zh'
        # 方言已归置为「音色的一种」：语种为中文时，音色列表里会多出
        # 粤语/四川话/东北话/河南话/台湾腔 五项（voiceSample: voice-sample-dialect-<code>.mp3）。
        # 方言音色走预置音色发音（克隆音色的普通话口音无法覆盖）。
        # 语速倍率（0.5–2，1 = 不变）。留空按语种默认：中文 1.00 / 英语 1.08 / 日语 1.12 / 韩语 1.25。
        # 实现方式是合成后用 ffmpeg atempo 变速不变调（提示词调语速在 MiMo 上不稳定）。
        # speechRateFactor: 1.12
        # MiMo API Key。留空则按 环境变量 MIMO_API_KEY → ~/.dsh/.credentials.yaml 的 refs 取；
        # 也可以在「设置 → 插件 → MiMo 语音汇报」的卡片里粘贴，插件会写回这一行。
        apiKey: ''
